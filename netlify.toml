[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep in sync with .nvmrc and package.json engines.
  # Astro 7 requires >=22.12.0; 24 is the active LTS.
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://project-insomnia.com/*"
  to = "https://projectinsomnia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.project-insomnia.com/*"
  to = "https://projectinsomnia.com/:splat"
  status = 301
  force = true
