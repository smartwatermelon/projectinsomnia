name: Dependabot Auto-Merge

on: # zizmor: ignore[dangerous-triggers] required to run from base branch; no PR code executed here
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    # Pinned to v2.1.0 for the dev-env#120 pilot (allow_major). Return to
    # @dependabot-auto-merge-v2 once that tag moves to include the input.
    uses: smartwatermelon/github-workflows/.github/workflows/dependabot-auto-merge.yml@dependabot-auto-merge-v2.1.0
    with:
      trusted_namespaces: 'smartwatermelon'
      allow_major: true
