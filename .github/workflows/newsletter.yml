name: Newsletter

# Sends new posts to Buttondown. No Netlify token, hook or push; reads rss.xml only.

on:
  # No workflow_run trigger: zizmor flags it as dangerous-triggers. A post
  # merged with a past date goes out at the next daily run instead.
  schedule:
    # 13:47 UTC, off the hour because GitHub delays jobs queued at :00.
    - cron: '47 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be sent; send nothing'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send new posts
        run: node scripts/send-newsletter.mjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}

  report:
    # A red run alone only emails whoever last edited the workflow.
    # Open one tracking issue instead, or comment on it if it is still open.
    needs: send
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Newsletter send failed"
          body="The newsletter send failed: ${RUN_URL}

          Open the run log to see why.
          Close this issue once the send works; the next failure opens a new one."
          existing=$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "Failed again: ${RUN_URL}"
            echo "Commented on #${existing}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
