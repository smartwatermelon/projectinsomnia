name: Scheduled Site Health

# Daily production checks (#171). Must never start a Netlify build: add no Netlify secret, hook or deploy step.

on:
  schedule:
    # 14:17 UTC = 06:17 Pacific standard time (07:17 in daylight time).
    # Off the hour, because GitHub delays jobs queued at :00.
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-health
  cancel-in-progress: false

env:
  SITE_URL: https://projectinsomnia.com

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Routes, RSS, and redirects
        id: routes
        run: scripts/verify-deploy-preview.sh "${SITE_URL}"

      - name: Page and feed content
        id: content
        # Run even when the first step fails, so one report shows everything.
        if: ${{ !cancelled() }}
        env:
          # strava: 502 until the OAuth scope is fixed (#174). Remove it from
          # this list when that issue closes; the script warns once it passes.
          KNOWN_FAILURES: strava
        run: scripts/verify-live-content.sh "${SITE_URL}"

  report:
    # A red scheduled run alone only emails whoever last edited the cron.
    # Open one tracking issue instead, or comment on it if it is still open.
    needs: check
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Scheduled site health check failed"
          body="The scheduled site health check failed: ${RUN_URL}

          Open the run log to see which checks failed.
          Close this issue once the site is fixed; the next failure opens a new one."
          existing=$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "Failed again: ${RUN_URL}"
            echo "Commented on #${existing}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
