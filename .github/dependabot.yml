# Dependabot: auto-PR version bumps. Two ecosystems, see each block below.
version: 2
updates:
  # GitHub Actions pins in .github/workflows/.
  # Primary target: the smartwatermelon/github-workflows reusable workflow
  # (see https://github.com/smartwatermelon/github-workflows/releases).
  # Secondary: any other actions/* or third-party actions used here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # npm: routine version bumps for the package.json tree.
  #
  # Patch and minor bumps are grouped so a routine week is one PR rather than
  # one per package. Majors are deliberately left ungrouped: a grouped PR never
  # qualifies for auto-merge (the shared dependabot-auto-merge workflow forces
  # any multi-dependency PR onto the trusted-namespace path), so bundling a
  # major would only bury it in a diff nobody auto-merges anyway.
  #
  # @astrojs/netlify is ignored for major bumps on purpose. Whenever npm has an
  # advisory to "fix" here, its proposed fix is a DOWNGRADE to 6.4.1, which
  # would reintroduce the Astro 5 content-collection API and re-break the site
  # the way #120 fixed. The audit is at zero as of 2026-09-02, but the trap
  # returns with the next advisory, so this ignore stays. Forward majors need
  # the deliberate upgrade project, not an unattended PR. See #123.
  #
  # Note: the `@netlify/vite-plugin: ^3.0.1` override in package.json is what
  # holds the audit at zero (see docs/SECURITY-AUDIT.md). Dependabot does not
  # manage `overrides`, so it will not bump or drop that entry on its own.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@astrojs/netlify"
        update-types: ["version-update:semver-major"]
